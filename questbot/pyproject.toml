[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "questbot"
version = "0.1.0"
description = "Discord automatic quest farmer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "discord.py>=2.4.0,<3.0.0",
    "aiohttp>=3.10.0,<4.0.0",
    "aiosqlite>=0.20.0,<1.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
]

[project.scripts]
questbot = "questbot.bot:main"

[tool.setuptools]
packages = ["questbot"]
